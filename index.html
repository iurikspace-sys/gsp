<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seq Trainer v8</title>
<style>
  :root { --ui: 0.8; }   /* масштаб интерфейса (кнопки, гриф, список); 1 = крупно, 0.5 = вдвое меньше */
  html, body { height: 100%; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #fafafa; color: #222; display: flex; flex-direction: column; overflow: hidden; }
  header { zoom: var(--ui); flex: none; position: relative; z-index: 2000; padding: 10px 24px; background: #fff; border-bottom: 1px solid #ddd; }
  #tabs { margin-bottom: 8px; }
  #tabs button { padding: 6px 20px; background: #fff; border: 1px solid #ddd; border-radius: 6px; }
  #tabs button.active { background: #e8f0fe; border-color: #7aa7f7; font-weight: 600; }
  #crumbs { font-size: 14px; color: #666; margin-bottom: 6px; }
  #crumbs b { color: #222; }
  button { font-size: 15px; padding: 6px 16px; margin-right: 6px; cursor: pointer; }
  button:disabled { cursor: default; opacity: .5; }
  label { font-size: 14px; margin-left: 8px; }
  #status { margin-left: 12px; font-size: 13px; color: #666; }
  #layout { flex: 1; min-height: 0; display: grid; grid-template-columns: calc(250px * var(--ui)) 1fr calc(240px * var(--ui)); grid-template-rows: minmax(0, 1fr); gap: 16px; padding: 0 24px; }
  #list { zoom: var(--ui); overflow-y: auto; padding: 16px 0; }
  #list button { display: block; width: 100%; margin: 0 0 4px; text-align: left; font-size: 14px; padding: 8px 10px; background: #fff; border: 1px solid #ddd; border-radius: 6px; }
  #list button.active { background: #e8f0fe; border-color: #7aa7f7; font-weight: 600; }
  #atwrap { position: relative; overflow-y: auto; padding: 16px 0; isolation: isolate; contain: paint; }
  #panel { zoom: var(--ui); overflow-y: auto; padding: 16px 0; }
  #panel section { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 10px; margin-bottom: 8px; }
  #panel h3 { margin: 0 0 6px; font-size: 14px; color: #666; font-weight: 600; }
  #panel label { margin-left: 0; display: block; margin-bottom: 6px; }
  #panel input[type=range] { width: 100%; margin: 4px 0 0; }
  #panel .row button { margin: 4px 4px 0 0; padding: 4px 10px; font-size: 14px; }
  #bpm { font-size: 44px; font-weight: 600; line-height: 1; }
  #bpmUnit { font-size: 12px; color: #666; margin-bottom: 4px; }
  /* курсор alphaTab: зелёный */
  .at-cursor-bar { background: rgba(46, 160, 67, .10); }
  .at-cursor-beat { background: #2ea043; width: 3px; }
  .at-selection div { background: rgba(46, 160, 67, .08); }
  .at-highlight * { fill: #2ea043; stroke: #2ea043; }
  #fretboard { margin-top: 8px; }
</style>
</head>
<body>
<header>
  <div id="tabs"></div>
  <div id="crumbs">…</div>
  <button id="play" disabled>▶ Play</button>
  <button id="stop" disabled>■ Stop</button>
  <label><input type="checkbox" id="loop" checked> Повтор</label>
  <span id="status">загрузка…</span>
  <div id="fretboard"></div>
</header>
<div id="layout">
  <nav id="list"></nav>
  <div id="atwrap"><div id="at"></div></div>
  <aside id="panel">
    <section>
      <h3>Темп</h3>
      <div id="bpm">75</div>
      <div id="bpmUnit">ударов в минуту</div>
      <div class="row">
        <button data-d="-5">−5</button><button data-d="-1">−1</button><button data-d="1">+1</button><button data-d="5">+5</button>
      </div>
      <input type="range" id="bpmRange" min="40" max="240" step="1" value="75">
    </section>
    <section>
      <label><input type="checkbox" id="metro"> Метроном</label>
      <input type="range" id="metroVol" min="0" max="100" value="80">
    </section>
    <section>
      <label><input type="checkbox" id="countIn"> Счёт перед стартом</label>
    </section>
    <section>
      <h3>Громкость</h3>
      <input type="range" id="master" min="0" max="100" value="100">
    </section>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.6.3/dist/alphaTab.min.js"></script>
<script>
// Вкладки и главы берутся из data/index.json; глава открывается по адресу index.html#chromatic/chapter01  →  data/chromatic/chapter01.json
let catalog = {};          // { категория: [главы] } из data/index.json
const lastPlayed = {};     // на каждой вкладке: { ch: глава, name: упражнение } — где в последний раз нажимали Play
let pendingName = null;    // какое упражнение выбрать после загрузки главы (null = первое)
let openCat = null, openCh = null;

const $ = s => document.querySelector(s);
const status = t => $("#status").textContent = t;
const NOTATION_SCALE = 0.65;   // масштаб нот и табов; 1 = крупно
const CDN = "https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.6.3/dist/";

const api = new alphaTab.AlphaTabApi($("#at"), {
  core: { fontDirectory: CDN + "font/" },
  display: { staveProfile: "ScoreTab", scale: NOTATION_SCALE },
  player: {
    enablePlayer: true,
    soundFont: CDN + "soundfont/sonivox.sf2",
    scrollElement: $("#atwrap"),
    enableCursor: true,
    enableAnimatedBeatCursor: true
  }
});
api.isLooping = true;

// ---------- гриф: 24 лада, подсветка играющей ноты ----------
const FRETS = 24, FW = 40, SP = 22, X0 = 36, Y0 = 16;
const NS = "http://www.w3.org/2000/svg";
function svgEl(name, attrs, parent) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const noteLayer = (function buildFretboard() {
  const top = Y0 - 8, bottom = Y0 + 5 * SP + 8, w = X0 + FRETS * FW + 10, h = bottom + 28;
  const svg = svgEl("svg", { viewBox: "0 0 " + w + " " + h, width: "100%" }, $("#fretboard"));
  svg.style.maxWidth = w + "px";
  svg.style.display = "block";
  svgEl("rect", { x: X0, y: top, width: FRETS * FW, height: bottom - top, fill: "#ead9b8" }, svg);
  for (let k = 0; k <= FRETS; k++) {
    const x = X0 + k * FW;
    svgEl("line", { x1: x, y1: top, x2: x, y2: bottom, stroke: k === 0 ? "#444" : "#999", "stroke-width": k === 0 ? 4 : 1.5 }, svg);
  }
  [3, 5, 7, 9, 15, 17, 19, 21].forEach(f => svgEl("circle", { cx: X0 + (f - 0.5) * FW, cy: Y0 + 2.5 * SP, r: 5, fill: "#cdbb92" }, svg));
  [12, 24].forEach(f => [1.5, 3.5].forEach(m => svgEl("circle", { cx: X0 + (f - 0.5) * FW, cy: Y0 + m * SP, r: 5, fill: "#cdbb92" }, svg)));
  ["e", "B", "G", "D", "A", "E"].forEach((name, i) => {
    const y = Y0 + i * SP;
    svgEl("line", { x1: X0, y1: y, x2: X0 + FRETS * FW, y2: y, stroke: "#555", "stroke-width": 1 + i * 0.35 }, svg);
    svgEl("text", { x: X0 - 10, y: y + 4, "text-anchor": "end", "font-size": 12, fill: "#555" }, svg).textContent = name;
  });
  for (let f = 1; f <= FRETS; f++) {
    svgEl("text", { x: X0 + (f - 0.5) * FW, y: bottom + 18, "text-anchor": "middle", "font-size": 12, fill: "#555" }, svg).textContent = f;
  }
  return svgEl("g", {}, svg);
})();

function showNotes(beats) {
  noteLayer.textContent = "";
  for (const b of beats) for (const n of b.notes) {
    if (n.fret < 1 || n.fret > FRETS) continue;
    // в alphaTab string 1 = самая толстая; на грифе сверху самая тонкая
    const row = 6 - n.string;
    svgEl("circle", { cx: X0 + (n.fret - 0.5) * FW, cy: Y0 + row * SP, r: 9, fill: "#8b0000", stroke: "#fff", "stroke-width": 1.5 }, noteLayer);
  }
}

let exercises = [];   // { label, bar, startTick, endTick }
let current = 0;
let ready = false;

// ---------- панель метронома; значения запоминаются в браузере ----------
const DEFAULTS = { bpm: 75, metro: false, metroVol: 80, countIn: false, master: 100 };
function loadSettings() { try { return JSON.parse(localStorage.getItem("seqSettings")) || {}; } catch (e) { return {}; } }
function saveSettings() { try { localStorage.setItem("seqSettings", JSON.stringify(st)); } catch (e) { /* хранилище недоступно */ } }
const clamp = (v, lo, hi, def) => { v = Number(v); return Number.isFinite(v) ? Math.min(hi, Math.max(lo, Math.round(v))) : def; };
const st = Object.assign({}, DEFAULTS, loadSettings());
st.bpm = clamp(st.bpm, 40, 240, DEFAULTS.bpm);
st.metroVol = clamp(st.metroVol, 0, 100, DEFAULTS.metroVol);
st.master = clamp(st.master, 0, 100, DEFAULTS.master);
st.metro = st.metro === true;
st.countIn = st.countIn === true;
let baseTempo = 75;   // темп, записанный в файле упражнений

function applyAudio() {
  if (!ready) return;
  api.playbackSpeed = st.bpm / baseTempo;
  api.metronomeVolume = st.metro ? st.metroVol / 100 : 0;
  api.countInVolume = st.countIn ? 1 : 0;
  api.masterVolume = st.master / 100;
}
function syncPanel() {
  $("#bpm").textContent = st.bpm;
  $("#bpmRange").value = st.bpm;
  $("#metro").checked = st.metro;
  $("#metroVol").value = st.metroVol;
  $("#countIn").checked = st.countIn;
  $("#master").value = st.master;
}
function changed() { syncPanel(); applyAudio(); saveSettings(); }
document.querySelectorAll("#panel .row button").forEach(b => b.onclick = () => { st.bpm = clamp(st.bpm + Number(b.dataset.d), 40, 240, st.bpm); changed(); });
$("#bpmRange").oninput = e => { st.bpm = clamp(e.target.value, 40, 240, st.bpm); changed(); };
$("#metro").onchange = e => { st.metro = e.target.checked; changed(); };
$("#metroVol").oninput = e => { st.metroVol = clamp(e.target.value, 0, 100, st.metroVol); changed(); };
$("#countIn").onchange = e => { st.countIn = e.target.checked; changed(); };
$("#master").oninput = e => { st.master = clamp(e.target.value, 0, 100, st.master); changed(); };
syncPanel();

// упражнения = такты с подписью (\section) в alphaTex
api.scoreLoaded.on(score => {
  const bars = score.masterBars;
  baseTempo = score.tempo || 75;
  exercises = bars.filter(mb => mb.section).map(mb => ({ label: mb.section.text, name: mb.section.text.split(": ").slice(1).join(": ") || mb.section.text, bar: mb.index, startTick: mb.start }));
  if (!exercises.length) exercises = [{ label: score.title || "Упражнение", name: score.title || "Упражнение", bar: 0, startTick: 0 }];
  const last = bars[bars.length - 1], end = last.start + last.calculateDuration();
  exercises.forEach((e, i) => e.endTick = i + 1 < exercises.length ? exercises[i + 1].startTick : end);
  const idx = exercises.findIndex(e => e.name === pendingName);   // упражнение, на котором в этой вкладке последний раз нажимали Play
  current = idx >= 0 ? idx : 0;
  buildList();
  applyRange();
  applyAudio();
  if (ready) status("готово");
  const act = $("#list").children[current];
  if (act) act.scrollIntoView({ block: "nearest" });
});

function buildList() {
  const nav = $("#list");
  nav.textContent = "";
  exercises.forEach((e, i) => {
    const b = document.createElement("button");
    b.textContent = e.label;
    b.className = i === current ? "active" : "";
    b.onclick = () => select(i);
    nav.appendChild(b);
  });
}

// играть только выбранное упражнение
function applyRange() {
  if (!ready || !exercises.length) return;
  const e = exercises[current];
  api.playbackRange = { startTick: e.startTick, endTick: e.endTick };
  api.tickPosition = e.startTick;
}

function select(i) {
  current = i;
  if (ready) api.stop();
  showNotes([]);
  [...$("#list").children].forEach((b, k) => b.classList.toggle("active", k === i));
  applyRange();
  scrollToExercise(i);
}

function scrollToExercise(i) {
  try {
    const b = api.boundsLookup.findMasterBarByIndex(exercises[i].bar);
    if (!b) return;
    $("#atwrap").scrollTo({ top: Math.max(0, $("#at").offsetTop + b.realBounds.y - 8), behavior: "smooth" });
  } catch (e) { /* нотация ещё не отрисована */ }
}

api.soundFontLoad.on(e => status("звуки: " + Math.round(e.loaded / e.total * 100) + "%"));
api.playerReady.on(() => { ready = true; $("#play").disabled = false; $("#stop").disabled = false; status("готово"); applyRange(); applyAudio(); });
api.renderFinished.on(() => { if (!ready) status("нотация отрисована"); });
api.activeBeatsChanged.on(e => showNotes(e.activeBeats));
api.playerFinished.on(() => showNotes([]));
api.error.on(e => { console.error(e); status("ошибка: " + (e.message || e)); });
api.playerStateChanged.on(e => {
  $("#play").textContent = e.state === 1 ? "❚❚ Pause" : "▶ Play";
  // запоминаем упражнение только когда нажали Play (а не просто выбрали)
  if (e.state === 1 && openCat && exercises[current]) lastPlayed[openCat] = { ch: openCh, name: exercises[current].name };
});

$("#play").onclick = () => api.playPause();
$("#stop").onclick = () => { api.stop(); showNotes([]); };
$("#loop").onchange = e => { api.isLooping = e.target.checked; };

// ---------- вкладки и главы ----------
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

function resolve() {
  const cats = Object.keys(catalog);
  let [c, ch] = location.hash.slice(1).split("/");
  if (!has(catalog, c)) { c = cats[0]; ch = null; }
  const list = catalog[c];
  if (!list.includes(ch)) ch = lastPlayed[c] && list.includes(lastPlayed[c].ch) ? lastPlayed[c].ch : list[0];
  return { c, ch };
}

function buildTabs() {
  const box = $("#tabs");
  box.textContent = "";
  Object.keys(catalog).forEach(c => {
    const b = document.createElement("button");
    b.textContent = cap(c);
    b.className = c === openCat ? "active" : "";
    b.onclick = () => { location.hash = c + "/" + (lastPlayed[c] && catalog[c].includes(lastPlayed[c].ch) ? lastPlayed[c].ch : catalog[c][0]); };
    box.appendChild(b);
  });
}

function showCrumbs(c, ch) {
  const box = $("#crumbs");
  box.innerHTML = "";
  const parts = [cap(c), cap(ch)];
  parts.forEach((p, i) => {
    const el = document.createElement(i === parts.length - 1 ? "b" : "span");
    el.textContent = p;
    box.append(el, i < parts.length - 1 ? " / " : "");
  });
}

let loadSeq = 0;
function loadChapter(c, ch) {
  const my = ++loadSeq;
  if (ready) api.stop();
  showNotes([]);
  status("загрузка главы…");
  fetch("data/" + c + "/" + ch + ".json?t=" + Date.now(), { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error("файл не найден: data/" + c + "/" + ch + ".json"); return r.json(); })
    .then(d => {
      if (my !== loadSeq) return;
      if (!d.alphatex) throw new Error("в файле главы нет alphatex");
      $("#atwrap").scrollTop = 0;
      api.tex(d.alphatex);
    })
    .catch(e => {
      if (my !== loadSeq) return;
      console.error(e); status(String(e.message || e));
      exercises = []; buildList();
    });
}

function route() {
  if (!Object.keys(catalog).length) return;
  const { c, ch } = resolve();
  if (!ch) { status("в index.json у вкладки «" + c + "» нет глав"); return; }
  const want = "#" + c + "/" + ch;
  if (location.hash !== want) history.replaceState(null, "", want);
  if (c === openCat && ch === openCh) return;
  openCat = c; openCh = ch;
  pendingName = lastPlayed[c] && lastPlayed[c].ch === ch ? lastPlayed[c].name : null;
  buildTabs();
  showCrumbs(c, ch);
  loadChapter(c, ch);
}
window.addEventListener("hashchange", route);

fetch("data/index.json?t=" + Date.now(), { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error("файл не найден: data/index.json"); return r.json(); })
  .then(d => {
    if (!d || typeof d !== "object" || Array.isArray(d) || !Object.keys(d).length) throw new Error("index.json: ожидался список вкладок и глав");
    catalog = d;
    route();
  })
  .catch(e => { console.error(e); status(String(e.message || e)); });
</script>
</body>
</html>
