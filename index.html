<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Тест: неполный такт (\ac) в alphaTab 1.6.3</title>
<style>
  body { font-family: sans-serif; margin: 16px; background: #fafafa; color: #222; }
  button, label { margin-right: 10px; font-size: 15px; }
  #at { background: #fff; border: 1px solid #ccc; margin: 12px 0; }
  pre { background: #f0f0f0; padding: 8px; font-size: 13px; white-space: pre-wrap; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.6.3/dist/alphaTab.min.js"></script>
</head>
<body>
<p>
  Exercise 01 и 02: последний такт неполный, помечен <b>\ac</b> (без пауз). Exercise 03: контроль, последний такт добит паузами, как сейчас.
</p>
<p>
  <button id="play">Play / Pause</button>
  <button id="stop">Stop</button>
  <label><input type="checkbox" id="met" checked> метроном</label>
</p>
<div id="at"></div>
<b>Такты (скопируй сюда и пришли мне):</b>
<pre id="info">загрузка…</pre>
<b>События воспроизведения:</b>
<pre id="log"></pre>

<script>
const CDN = "https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.6.3/dist/";
const TEX = `\\tempo 75
\\instrument 27
\\tuning e4 b3 g3 d3 a2 e2
.
\\section "Exercise 01"
:16
7.3 7.2 8.3 8.2 8.3 8.2 7.2 10.2 7.3 7.2 8.3 8.2 8.3 8.2 7.2 10.2 |
\\ac 8.3 8.2 7.2 10.2 7.3 7.2 8.3 8.2 |
\\section "Exercise 02"
8.3 8.2 7.2 10.2 7.3 7.2 8.3 8.2 7.3 7.2 8.3 8.2 8.3 8.2 7.2 10.2 |
\\ac 7.3 7.2 8.3 8.2 8.3 8.2 7.2 10.2 |
\\section "Exercise 03 (контроль: с паузами)"
7.3 7.2 8.3 8.2 8.3 8.2 7.2 10.2 7.3 7.2 8.3 8.2 8.3 8.2 7.2 10.2 |
8.3 8.2 7.2 10.2 7.3 7.2 8.3 8.2 r r r r r r r r |
`;

const $ = s => document.querySelector(s);
const log = t => { $("#log").textContent += t + "\n"; };

const api = new alphaTab.AlphaTabApi($("#at"), {
  core: { fontDirectory: CDN + "font/" },
  display: { scale: 0.9 },
  player: {
    enablePlayer: true,
    soundFont: CDN + "soundfont/sonivox.sf2",
    enableCursor: true,
    enableAnimatedBeatCursor: true
  }
});
api.countInVolume = 0;
api.metronomeVolume = 1;

api.scoreLoaded.on(score => {
  const lines = ["версия alphaTab: " + (alphaTab.VersionInfo ? alphaTab.VersionInfo.version : "?")];
  score.masterBars.forEach((mb, i) => {
    let dur = "?";
    try { dur = mb.calculateDuration(); } catch (e) { dur = "ошибка: " + e.message; }
    lines.push("такт " + (i + 1) + ": start=" + mb.start + ", длительность=" + dur +
      ", isAnacrusis=" + mb.isAnacrusis + (mb.section ? ", метка=" + mb.section.text : ""));
  });
  $("#info").textContent = lines.join("\n");
});
api.error.on(e => log("ОШИБКА alphaTab: " + (e && e.message ? e.message : e)));
api.playerReady.on(() => log("плеер готов"));
api.playerStateChanged.on(a => log("состояние: " + (a.state === 1 ? "играет" : "стоп/пауза")));
api.playerFinished.on(() => log("доиграно до конца"));

api.tex(TEX);

$("#play").onclick = () => api.playPause();
$("#stop").onclick = () => api.stop();
$("#met").onchange = e => { api.metronomeVolume = e.target.checked ? 1 : 0; };
</script>
</body>
</html>
